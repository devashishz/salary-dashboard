name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    name: Code Quality & Validation
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Step 3: Install project dependencies & tools
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      # Step 4: Python Syntax Compilation Check
      - name: Check Python syntax
        run: |
          python -m py_compile app.py

      # Step 5: Linting with Ruff (Modern linter standard)
      - name: Lint code with Ruff
        run: |
          # F401: unused imports, E999: syntax errors, etc.
          ruff check app.py

      # Step 6: Security audit for dependency vulnerabilities
      - name: Run security vulnerability audit
        run: |
          pip-audit -r requirements.txt --ignore-vuln || true

      # Step 7: Headless Smoke Test for Streamlit app
      - name: Smoke test Streamlit script
        run: |
          python -c "import app; print('Module successfully imported and parsed without runtime errors')"